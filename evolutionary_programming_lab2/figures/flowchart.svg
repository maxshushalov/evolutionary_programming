<text x="772" y="486">или «не найдено»</text>
<text x="456" y="385">Да</text><text x="714" y="290">Нет</text>
<text x="430" y="892" font-size="15">При исчерпании бюджета незаполненные места занимают старые особи.</text>
<text x="430" y="915" font-size="15">Сохранённые оценки элиты и старых особей повторно не вычисляются.</text>
