<text x="430" y="97">Каталог, конфигурация, seed</text>
<text x="430" y="180">Создать 100 меню и оценить каждое</text>
<text x="430" y="206">Сохранить лучший допустимый результат</text>
<text x="430" y="310">Остался общий бюджет?</text>
<text x="430" y="425">В начале поколения сохранить элиту</text>
<text x="430" y="450">Выбрать родителей</text>
<text x="430" y="527">Кроссовер целыми днями → мутация</text>
